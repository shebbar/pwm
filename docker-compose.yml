# Stack: Express API + Next.js, using the Postgres container `pgdb` from ~/systems/postgres.
#
# Both stacks share the external network `pwm-net` (pgdb joins it via systems/postgres/docker-compose.yml).
# One-time setup:
#   docker network create pwm-net || true
#   docker compose -f ~/systems/postgres/docker-compose.yml up -d
# Then run:
#   docker compose up --build
#
# Browser uses http://localhost:3000 → API http://localhost:4000.
# MCP server (Streamable HTTP, read-only tools, bearer-token auth) on http://localhost:4100/mcp.
# Requires MCP_AUTH_TOKEN set in .env (e.g. `openssl rand -hex 32`).
services:
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: pwm-api
    environment:
      # Override if your pgdb creds/db differ:
      # DATABASE_URL="postgresql://<username>:<password>@pgdb:5432/pwm"
      DATABASE_URL: ${DATABASE_URL:-postgresql://shebbar:hebbar123@pgdb:5432/pwm}
      PORT: "4000"
      # Chat agent's Claude Platform key, backend-only. Set in a repo-root
      # .env (see .env.example) -- never name it ANTHROPIC_API_KEY.
      PORTFOLIO_LLM_API_KEY: ${PORTFOLIO_LLM_API_KEY:-}
      # A registry key from llm/registry.ts ("claude-haiku" | "claude-sonnet"),
      # NOT a raw Anthropic model ID anymore -- see config.ts.
      PORTFOLIO_LLM_MODEL: ${PORTFOLIO_LLM_MODEL:-claude-haiku}
      # The chat agent is itself an MCP client now -- it calls tools over
      # the network via the mcp service rather than importing tools.ts
      # directly, so it needs the same bearer token mcp-server.ts checks.
      MCP_SERVER_URL: ${MCP_SERVER_URL:-http://mcp:4100/mcp}
      MCP_AUTH_TOKEN: ${MCP_AUTH_TOKEN:-}
    ports:
      - "4000:4000"
    depends_on:
      - mcp
    networks:
      - pwm-net

  mcp:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: pwm-mcp
    command: node dist/mcp-server.js
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://shebbar:hebbar123@pgdb:5432/pwm}
      MCP_PORT: "4100"
      MCP_AUTH_TOKEN: ${MCP_AUTH_TOKEN:-}
    ports:
      # Host-side bound to loopback only -- not reachable from the rest of
      # your LAN, just this machine. Defense in depth alongside the bearer
      # token, not a replacement for it.
      - "127.0.0.1:4100:4100"
    networks:
      - pwm-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # Browser (your machine) → API on host port 4000
        NEXT_PUBLIC_API_URL: http://localhost:4000
    container_name: pwm-frontend
    environment:
      # Next.js server-side fetch inside this container → API service on Docker network
      API_INTERNAL_URL: http://api:4000
    ports:
      - "3000:3000"
    depends_on:
      - api
    networks:
      - pwm-net

networks:
  pwm-net:
    external: true
