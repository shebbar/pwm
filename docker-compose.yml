# Stack: Express API + Next.js, using the Postgres container `pgdb` from ~/systems/postgres.
#
# Both stacks share the external network `pwm-net` (pgdb joins it via systems/postgres/docker-compose.yml).
# One-time setup:
#   docker network create pwm-net || true
#   docker compose -f ~/systems/postgres/docker-compose.yml up -d
# Then run:
#   docker compose up --build
#
# Browser uses http://localhost:3000 → API http://localhost:4000.
# MCP server (Streamable HTTP, scoped bearer-token auth) on http://localhost:4100/mcp.
# Requires MCP_READ_TOKEN and MCP_PROPOSE_TOKEN set in .env (e.g. `openssl rand -hex 32` each).
# This app's own agent uses MCP_PROPOSE_TOKEN; give external clients (e.g. Claude Desktop) MCP_READ_TOKEN.
services:
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: pwm-api
    environment:
      # Override if your pgdb creds/db differ:
      # DATABASE_URL="postgresql://<username>:<password>@pgdb:5432/pwm"
      DATABASE_URL: ${DATABASE_URL:-postgresql://postgres:postgres@pgdb:5432/pwm}
      PORT: "4000"
      # Chat agent's Claude Platform key, backend-only. Set in a repo-root
      # .env (see .env.example) -- never name it ANTHROPIC_API_KEY.
      PORTFOLIO_LLM_API_KEY: ${PORTFOLIO_LLM_API_KEY:-}
      # The chat agent is itself an MCP client now -- it calls tools over
      # the network via the mcp service rather than importing tools.ts
      # directly. Uses the propose-scoped token since this app's own
      # agent (unlike an external client) is meant to stage proposals.
      MCP_SERVER_URL: ${MCP_SERVER_URL:-http://mcp:4100/mcp}
      MCP_PROPOSE_TOKEN: ${MCP_PROPOSE_TOKEN:-}
      # The critic agent (runCritic, agent.ts) is a second MCP client in
      # this same process -- it connects with the read-only token since it
      # has no propose_* tools at all.
      MCP_READ_TOKEN: ${MCP_READ_TOKEN:-}
      # Guards /api/actions/* (approve/reject proposals) -- separate token
      # from the MCP tokens since the caller here is the browser, not
      # another backend process. Must match frontend's build-time
      # NEXT_PUBLIC_ACTIONS_TOKEN below.
      ACTIONS_AUTH_TOKEN: ${ACTIONS_AUTH_TOKEN:-}
    ports:
      - "4000:4000"
    depends_on:
      - mcp
    networks:
      - pwm-net

  mcp:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: pwm-mcp
    command: node dist/mcp-server.js
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://postgres:postgres@pgdb:5432/pwm}
      MCP_PORT: "4100"
      # Both scoped tokens live here -- this service is the one that
      # validates them and decides which tools a given caller can see.
      MCP_READ_TOKEN: ${MCP_READ_TOKEN:-}
      MCP_PROPOSE_TOKEN: ${MCP_PROPOSE_TOKEN:-}
    ports:
      # Host-side bound to loopback only -- not reachable from the rest of
      # your LAN, just this machine. Defense in depth alongside the bearer
      # token, not a replacement for it.
      - "127.0.0.1:4100:4100"
    networks:
      - pwm-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # Browser (your machine) → API on host port 4000
        NEXT_PUBLIC_API_URL: http://localhost:4000
        # Baked into the JS bundle at build time -- must match the api
        # service's ACTIONS_AUTH_TOKEN above. See routes/api.ts's comment
        # on requireActionsAuth for why this level of protection is enough
        # here (not a real secret, just stops blind/automated requests).
        NEXT_PUBLIC_ACTIONS_TOKEN: ${ACTIONS_AUTH_TOKEN:-}
    container_name: pwm-frontend
    environment:
      # Next.js server-side fetch inside this container → API service on Docker network
      API_INTERNAL_URL: http://api:4000
    ports:
      - "3000:3000"
    depends_on:
      - api
    networks:
      - pwm-net

networks:
  pwm-net:
    external: true
